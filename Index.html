<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>The Daily Tab</title>

<!-- Makes this behave like an installed app when added to the iOS Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daily Tab" />
<meta name="theme-color" content="#DED5C0" />

<style>
  html, body { margin: 0; padding: 0; background: #DED5C0; }
  #root { min-height: 100vh; }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

/* ---------------------------------------------------------------
   Storage shim: mirrors the window.storage API this app was
   originally built against, but backed by real localStorage so it
   works as a normal, standalone web page (no Claude.ai required).
--------------------------------------------------------------- */
window.storage = {
  async get(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? { key, value: raw, shared: false } : null;
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys };
  },
};

/* ---------- palette & type ----------
   paper       #F3EEE0  receipt stock
   paperEdge   #E7DFC9  dividers / track backgrounds
   backdrop    #DED5C0  counter the receipt sits on
   slip        #FBF8F1  order-slip / modal stock (whiter ticket paper)
   ink         #2B2A28  primary print
   inkFaint    #8C8574  faded thermal print (secondary)
   red         #B23A2E  single accent, reserved for over-budget alerts
------------------------------------- */

const C = {
  paper: "#F3EEE0",
  paperEdge: "#E7DFC9",
  backdrop: "#DED5C0",
  slip: "#FBF8F1",
  ink: "#2B2A28",
  inkFaint: "#8C8574",
  red: "#B23A2E",
};

const MEALS = ["Breakfast", "Lunch", "Dinner", "Snacks"];
const DEFAULT_GOALS = { calories: 2400, protein: 150, carbs: 250, fat: 70 };

function pad(n) {
  return n.toString().padStart(2, "0");
}
function dateKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function displayDate(d) {
  return d
    .toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })
    .toUpperCase();
}
function defaultMealForNow() {
  const h = new Date().getHours();
  if (h < 11) return "Breakfast";
  if (h < 15) return "Lunch";
  if (h < 21) return "Dinner";
  return "Snacks";
}
function makeId() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}
function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return h;
}
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function Barcode({ seed }) {
  const rand = mulberry32(hashStr(seed));
  const bars = Array.from({ length: 44 }, () => (rand() > 0.6 ? 3 : 1));
  return (
    <div style={{ display: "flex", alignItems: "stretch", height: 30, gap: 1, justifyContent: "center" }}>
      {bars.map((w, i) => (
        <div key={i} style={{ width: w, background: C.ink }} />
      ))}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "block", marginBottom: 12 }}>
      <span
        style={{
          display: "block",
          fontFamily: "'IBM Plex Mono', monospace",
          fontSize: 11,
          letterSpacing: "0.08em",
          color: C.inkFaint,
          marginBottom: 4,
        }}
      >
        {label}
      </span>
      {children}
    </label>
  );
}

const inputStyle = {
  width: "100%",
  boxSizing: "border-box",
  padding: "9px 10px",
  fontFamily: "'IBM Plex Mono', monospace",
  fontSize: 15,
  color: C.ink,
  background: "#fff",
  border: `1px solid ${C.paperEdge}`,
  borderRadius: 4,
};

function AddModal({ favorites, apiKey, onClose, onAdd, onAddMany, onSaveFavorite, onRemoveFavorite }) {
  const [mode, setMode] = useState("ai");
  const [meal, setMeal] = useState(defaultMealForNow());
  const [name, setName] = useState("");
  const [qty, setQty] = useState(1);
  const [calories, setCalories] = useState("");
  const [protein, setProtein] = useState("");
  const [carbs, setCarbs] = useState("");
  const [fat, setFat] = useState("");
  const [saveFav, setSaveFav] = useState(false);
  const [error, setError] = useState("");

  const [aiText, setAiText] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState("");
  const [aiPreview, setAiPreview] = useState([]);
  const [editingId, setEditingId] = useState(null);

  function logFavorite(f) {
    onAdd({
      meal,
      name: f.name,
      qty: 1,
      calories: f.calories,
      protein: f.protein,
      carbs: f.carbs,
      fat: f.fat,
    });
  }

  function submit() {
    const cal = parseFloat(calories);
    if (!name.trim()) {
      setError("Item needs a name.");
      return;
    }
    if (isNaN(cal) || cal < 0) {
      setError("Enter calories for this item.");
      return;
    }
    const item = {
      meal,
      name: name.trim(),
      qty: qty || 1,
      calories: cal,
      protein: parseFloat(protein) || 0,
      carbs: parseFloat(carbs) || 0,
      fat: parseFloat(fat) || 0,
    };
    onAdd(item);
    if (saveFav) {
      onSaveFavorite({
        name: item.name,
        calories: item.calories,
        protein: item.protein,
        carbs: item.carbs,
        fat: item.fat,
      });
    }
    setName("");
    setCalories("");
    setProtein("");
    setCarbs("");
    setFat("");
    setQty(1);
    setSaveFav(false);
    setError("");
  }

  async function estimateWithAI() {
    if (!apiKey) {
      setAiError("Add your Anthropic API key in Settings first.");
      return;
    }
    if (!aiText.trim()) {
      setAiError("Describe what you ate first.");
      return;
    }
    setAiLoading(true);
    setAiError("");
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 1000,
          messages: [
            {
              role: "user",
              content: `You are a nutrition estimator for a food-tracking app. Break the description below into individual food or drink items and estimate nutrition for each.

Description: "${aiText.trim()}"

Respond with ONLY valid JSON, no markdown code fences, no commentary before or after, in exactly this shape:
{"items":[{"name":"short item name","qty":1,"calories":0,"protein":0,"carbs":0,"fat":0}]}

Rules:
- One item per distinct food or drink mentioned.
- "qty" is the serving count (usually 1). calories/protein/carbs/fat must be the TOTAL for that qty, not per single unit.
- Use standard nutrition data and reasonable, typical portion assumptions when a size isn't given.
- Keep each name short and concrete (3-6 words).
- protein, carbs, and fat are in grams.`,
            },
          ],
        }),
      });
      const raw = await response.text();
      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        throw new Error(`Non-JSON HTTP response (${response.status}): ${raw.slice(0, 140)}`);
      }

      if (!response.ok || data.type === "error") {
        const msg = (data.error && data.error.message) || `HTTP ${response.status}`;
        throw new Error(msg);
      }

      const textBlocks = (data.content || [])
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n");

      if (!textBlocks.trim()) {
        throw new Error("Model returned no text content");
      }

      const cleaned = textBlocks.replace(/```json|```/g, "").trim();
      let parsed;
      try {
        parsed = JSON.parse(cleaned);
      } catch (e) {
        const match = cleaned.match(/\{[\s\S]*\}/);
        if (!match) throw new Error(`Couldn't find JSON in: ${cleaned.slice(0, 140)}`);
        parsed = JSON.parse(match[0]);
      }

      if (!parsed.items || !Array.isArray(parsed.items) || parsed.items.length === 0) {
        throw new Error("Response had no items array");
      }

      setAiPreview(
        parsed.items.map((it) => ({
          localId: makeId(),
          name: String(it.name || "Item").slice(0, 60),
          qty: Number(it.qty) > 0 ? Number(it.qty) : 1,
          calories: Number(it.calories) || 0,
          protein: Number(it.protein) || 0,
          carbs: Number(it.carbs) || 0,
          fat: Number(it.fat) || 0,
        }))
      );
    } catch (e) {
      console.error("AI estimate failed:", e);
      setAiError(`Couldn't read that back — try describing it a little differently. (${e.message})`);
    } finally {
      setAiLoading(false);
    }
  }

  function updatePreviewItem(localId, field, value) {
    setAiPreview((prev) => prev.map((it) => (it.localId === localId ? { ...it, [field]: value } : it)));
  }

  function removePreviewItem(localId) {
    setAiPreview((prev) => prev.filter((it) => it.localId !== localId));
    setEditingId((id) => (id === localId ? null : id));
  }

  function logAiItems() {
    if (aiPreview.length === 0) return;
    onAddMany(
      aiPreview.map(({ localId, ...rest }) => ({
        meal,
        ...rest,
      }))
    );
    setAiPreview([]);
    setAiText("");
    setEditingId(null);
  }

  return (
    <div className="ft-overlay" onClick={onClose}>
      <div className="ft-modal" onClick={(e) => e.stopPropagation()}>
        <div className="ft-modal-head">
          <span>NEW TICKET</span>
          <button className="ft-x" onClick={onClose} aria-label="Close">
            ×
          </button>
        </div>

        <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
          {MEALS.map((m) => (
            <button
              key={m}
              onClick={() => setMeal(m)}
              className="ft-seg"
              style={{
                background: meal === m ? C.ink : "transparent",
                color: meal === m ? C.slip : C.ink,
              }}
            >
              {m}
            </button>
          ))}
        </div>

        {favorites.length > 0 && (
          <div style={{ marginBottom: 18 }}>
            <div className="ft-caption">FREQUENTLY BOUGHT</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {favorites.map((f) => (
                <div key={f.id} className="ft-chip">
                  <button className="ft-chip-btn" onClick={() => logFavorite(f)}>
                    {f.name} · {Math.round(f.calories)}
                  </button>
                  <button
                    className="ft-chip-x"
                    onClick={() => onRemoveFavorite(f.id)}
                    aria-label={`Remove ${f.name} from favorites`}
                  >
                    ×
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
          <button
            className="ft-tab"
            onClick={() => setMode("ai")}
            style={{ background: mode === "ai" ? C.ink : "transparent", color: mode === "ai" ? C.slip : C.ink }}
          >
            ✎ DESCRIBE IT
          </button>
          <button
            className="ft-tab"
            onClick={() => setMode("manual")}
            style={{ background: mode === "manual" ? C.ink : "transparent", color: mode === "manual" ? C.slip : C.ink }}
          >
            TYPE IT MYSELF
          </button>
        </div>

        {mode === "ai" && (
          <div>
            <div className="ft-caption">WHAT DID YOU EAT?</div>
            <textarea
              value={aiText}
              onChange={(e) => setAiText(e.target.value)}
              placeholder="e.g. two scrambled eggs, a slice of rye toast with butter, black coffee"
              rows={3}
              disabled={aiLoading}
              style={{ ...inputStyle, resize: "vertical", fontSize: 14, lineHeight: 1.4 }}
            />
            {aiError && (
              <div style={{ color: C.red, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, margin: "8px 0 0" }}>{aiError}</div>
            )}
            {!apiKey && !aiError && (
              <div style={{ color: C.inkFaint, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, margin: "8px 0 0" }}>
                Add an Anthropic API key in Settings to use AI estimates.
              </div>
            )}
            <button className="ft-add-btn" onClick={estimateWithAI} disabled={aiLoading} style={{ marginTop: 10 }}>
              {aiLoading ? "READING THE MENU…" : "✎ ESTIMATE WITH AI"}
            </button>

            {aiPreview.length > 0 && (
              <div style={{ marginTop: 20 }}>
                <div className="ft-caption">CONFIRM BEFORE RINGING UP</div>
                {aiPreview.map((item) => (
                  <div key={item.localId} style={{ borderBottom: `1px dashed ${C.paperEdge}`, padding: "8px 0" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13.5 }}>
                      <span style={{ color: C.inkFaint, minWidth: 24 }}>{item.qty}×</span>
                      <span style={{ flex: 1 }}>{item.name}</span>
                      <span>{Math.round(item.calories * item.qty)}</span>
                      <button
                        className="ft-item-x"
                        onClick={() => setEditingId(editingId === item.localId ? null : item.localId)}
                        aria-label={`Edit ${item.name}`}
                        style={{ fontSize: 11, letterSpacing: "0.04em" }}
                      >
                        {editingId === item.localId ? "done" : "edit"}
                      </button>
                      <button className="ft-item-x" onClick={() => removePreviewItem(item.localId)} aria-label={`Remove ${item.name}`}>
                        ×
                      </button>
                    </div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.inkFaint, marginLeft: 32 }}>
                      P {Math.round(item.protein)}g · C {Math.round(item.carbs)}g · F {Math.round(item.fat)}g
                    </div>

                    {editingId === item.localId && (
                      <div style={{ marginTop: 8, marginLeft: 32 }}>
                        <input
                          style={{ ...inputStyle, marginBottom: 8 }}
                          value={item.name}
                          onChange={(e) => updatePreviewItem(item.localId, "name", e.target.value)}
                        />
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                          <input
                            style={inputStyle}
                            type="number"
                            inputMode="decimal"
                            value={item.calories}
                            onChange={(e) => updatePreviewItem(item.localId, "calories", parseFloat(e.target.value) || 0)}
                            placeholder="calories"
                          />
                          <input
                            style={inputStyle}
                            type="number"
                            inputMode="decimal"
                            value={item.qty}
                            onChange={(e) => updatePreviewItem(item.localId, "qty", parseFloat(e.target.value) || 1)}
                            placeholder="qty"
                          />
                          <input
                            style={inputStyle}
                            type="number"
                            inputMode="decimal"
                            value={item.protein}
                            onChange={(e) => updatePreviewItem(item.localId, "protein", parseFloat(e.target.value) || 0)}
                            placeholder="protein g"
                          />
                          <input
                            style={inputStyle}
                            type="number"
                            inputMode="decimal"
                            value={item.carbs}
                            onChange={(e) => updatePreviewItem(item.localId, "carbs", parseFloat(e.target.value) || 0)}
                            placeholder="carbs g"
                          />
                          <input
                            style={inputStyle}
                            type="number"
                            inputMode="decimal"
                            value={item.fat}
                            onChange={(e) => updatePreviewItem(item.localId, "fat", parseFloat(e.target.value) || 0)}
                            placeholder="fat g"
                          />
                        </div>
                      </div>
                    )}
                  </div>
                ))}
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.inkFaint, margin: "10px 0" }}>
                  AI estimate — check before ringing up.
                </div>
                <button className="ft-primary" onClick={logAiItems}>
                  RING UP {aiPreview.length} ITEM{aiPreview.length > 1 ? "S" : ""}
                </button>
              </div>
            )}
          </div>
        )}

        {mode === "manual" && (
          <div>
            <Field label="ITEM NAME">
              <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Grilled chicken thigh" />
            </Field>

            <Field label="QTY / SERVINGS">
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <button className="ft-step" onClick={() => setQty((q) => Math.max(0.5, q - 0.5))} aria-label="Decrease quantity">
                  −
                </button>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, minWidth: 28, textAlign: "center" }}>{qty}</span>
                <button className="ft-step" onClick={() => setQty((q) => q + 0.5)} aria-label="Increase quantity">
                  +
                </button>
              </div>
            </Field>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <Field label="CALORIES">
                <input style={inputStyle} type="number" inputMode="decimal" value={calories} onChange={(e) => setCalories(e.target.value)} placeholder="0" />
              </Field>
              <Field label="PROTEIN (G)">
                <input style={inputStyle} type="number" inputMode="decimal" value={protein} onChange={(e) => setProtein(e.target.value)} placeholder="0" />
              </Field>
              <Field label="CARBS (G)">
                <input style={inputStyle} type="number" inputMode="decimal" value={carbs} onChange={(e) => setCarbs(e.target.value)} placeholder="0" />
              </Field>
              <Field label="FAT (G)">
                <input style={inputStyle} type="number" inputMode="decimal" value={fat} onChange={(e) => setFat(e.target.value)} placeholder="0" />
              </Field>
            </div>

            <label style={{ display: "flex", alignItems: "center", gap: 8, margin: "14px 0 6px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: C.inkFaint }}>
              <input type="checkbox" checked={saveFav} onChange={(e) => setSaveFav(e.target.checked)} />
              Save as frequent item
            </label>

            {error && <div style={{ color: C.red, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, marginBottom: 8 }}>{error}</div>}

            <button className="ft-primary" onClick={submit}>
              RING UP ITEM
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function SettingsModal({ goals, apiKey, onClose, onSave, onSaveApiKey }) {
  const [calories, setCalories] = useState(goals.calories);
  const [protein, setProtein] = useState(goals.protein);
  const [carbs, setCarbs] = useState(goals.carbs);
  const [fat, setFat] = useState(goals.fat);
  const [key, setKey] = useState(apiKey || "");

  function submit() {
    onSave({
      calories: parseFloat(calories) || DEFAULT_GOALS.calories,
      protein: parseFloat(protein) || 0,
      carbs: parseFloat(carbs) || 0,
      fat: parseFloat(fat) || 0,
    });
    onSaveApiKey(key.trim());
    onClose();
  }

  return (
    <div className="ft-overlay" onClick={onClose}>
      <div className="ft-modal" onClick={(e) => e.stopPropagation()}>
        <div className="ft-modal-head">
          <span>SETTINGS</span>
          <button className="ft-x" onClick={onClose} aria-label="Close">
            ×
          </button>
        </div>

        <div className="ft-caption">DAILY BUDGET</div>
        <Field label="DAILY CALORIES">
          <input style={inputStyle} type="number" inputMode="decimal" value={calories} onChange={(e) => setCalories(e.target.value)} />
        </Field>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
          <Field label="PROTEIN (G)">
            <input style={inputStyle} type="number" inputMode="decimal" value={protein} onChange={(e) => setProtein(e.target.value)} />
          </Field>
          <Field label="CARBS (G)">
            <input style={inputStyle} type="number" inputMode="decimal" value={carbs} onChange={(e) => setCarbs(e.target.value)} />
          </Field>
          <Field label="FAT (G)">
            <input style={inputStyle} type="number" inputMode="decimal" value={fat} onChange={(e) => setFat(e.target.value)} />
          </Field>
        </div>

        <hr className="ft-rule" />

        <div className="ft-caption">AI QUICK-ADD</div>
        <Field label="ANTHROPIC API KEY">
          <input
            style={inputStyle}
            type="password"
            autoComplete="off"
            value={key}
            onChange={(e) => setKey(e.target.value)}
            placeholder="sk-ant-..."
          />
        </Field>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: C.inkFaint, lineHeight: 1.5, marginBottom: 4 }}>
          Get a key at console.anthropic.com → API Keys. It's stored only in this browser's local
          storage and sent straight from your phone to Anthropic — never through a server of ours.
          Anyone else using this browser could read it from network requests, so keep this device to
          yourself, and remove the key here if that ever changes.
        </div>

        <button className="ft-primary" onClick={submit} style={{ marginTop: 10 }}>
          SAVE SETTINGS
        </button>
      </div>
    </div>
  );
}

function FoodTracker() {
  const [currentDate, setCurrentDate] = useState(() => new Date());
  const [entries, setEntries] = useState([]);
  const [goals, setGoals] = useState(DEFAULT_GOALS);
  const [favorites, setFavorites] = useState([]);
  const [apiKey, setApiKey] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [toast, setToast] = useState("");

  const todayKey = dateKey(new Date());
  const key = dateKey(currentDate);
  const isToday = key === todayKey;

  useEffect(() => {
    (async () => {
      try {
        const g = await window.storage.get("goals", false);
        if (g && g.value) setGoals(JSON.parse(g.value));
      } catch (e) {
        /* no goals saved yet */
      }
      try {
        const f = await window.storage.get("favorites", false);
        if (f && f.value) setFavorites(JSON.parse(f.value));
      } catch (e) {
        /* no favorites saved yet */
      }
      try {
        const k = await window.storage.get("apiKey", false);
        if (k && k.value) setApiKey(k.value);
      } catch (e) {
        /* no key saved yet */
      }
    })();
  }, []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await window.storage.get(`log:${key}`, false);
        if (!cancelled) setEntries(res && res.value ? JSON.parse(res.value) : []);
      } catch (e) {
        if (!cancelled) setEntries([]);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [key]);

  const persistEntries = useCallback(
    async (next) => {
      setEntries(next);
      try {
        await window.storage.set(`log:${key}`, JSON.stringify(next), false);
      } catch (e) {
        console.error("Failed to save today's log", e);
      }
    },
    [key]
  );

  const persistGoals = useCallback(async (next) => {
    setGoals(next);
    try {
      await window.storage.set("goals", JSON.stringify(next), false);
    } catch (e) {
      console.error("Failed to save budget", e);
    }
  }, []);

  const persistApiKey = useCallback(async (next) => {
    setApiKey(next);
    try {
      await window.storage.set("apiKey", next, false);
    } catch (e) {
      console.error("Failed to save API key", e);
    }
  }, []);

  const persistFavorites = useCallback(async (next) => {
    setFavorites(next);
    try {
      await window.storage.set("favorites", JSON.stringify(next), false);
    } catch (e) {
      console.error("Failed to save favorites", e);
    }
  }, []);

  function flashToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 1600);
  }

  function addEntry(item) {
    const entry = { id: makeId(), time: new Date().toISOString(), ...item };
    persistEntries([...entries, entry]);
    flashToast(`Rang up: ${item.name}`);
  }

  function addEntries(items) {
    if (!items || items.length === 0) return;
    const stamped = items.map((it) => ({ id: makeId(), time: new Date().toISOString(), ...it }));
    persistEntries([...entries, ...stamped]);
    flashToast(items.length === 1 ? `Rang up: ${items[0].name}` : `Rang up ${items.length} items`);
  }

  function removeEntry(id) {
    persistEntries(entries.filter((e) => e.id !== id));
  }

  function addFavorite(fav) {
    persistFavorites([...favorites, { id: makeId(), ...fav }]);
  }

  function removeFavorite(id) {
    persistFavorites(favorites.filter((f) => f.id !== id));
  }

  function changeDay(delta) {
    const d = new Date(currentDate);
    d.setDate(d.getDate() + delta);
    setCurrentDate(d);
  }

  const totals = entries.reduce(
    (acc, e) => {
      const q = e.qty || 1;
      acc.calories += (e.calories || 0) * q;
      acc.protein += (e.protein || 0) * q;
      acc.carbs += (e.carbs || 0) * q;
      acc.fat += (e.fat || 0) * q;
      return acc;
    },
    { calories: 0, protein: 0, carbs: 0, fat: 0 }
  );

  const remaining = Math.round(goals.calories - totals.calories);
  const overBudget = remaining < 0;
  const pctUsed = goals.calories > 0 ? Math.min(100, (totals.calories / goals.calories) * 100) : 0;

  const grouped = MEALS.map((m) => ({
    meal: m,
    items: entries.filter((e) => e.meal === m),
    subtotal: entries.filter((e) => e.meal === m).reduce((s, e) => s + (e.calories || 0) * (e.qty || 1), 0),
  }));

  const macroRows = [
    { label: "PROTEIN", value: totals.protein, goal: goals.protein },
    { label: "CARBS", value: totals.carbs, goal: goals.carbs },
    { label: "FAT", value: totals.fat, goal: goals.fat },
  ];

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

        .ft-page * { box-sizing: border-box; }
        .ft-page button { cursor: pointer; }
        .ft-page :focus-visible { outline: 2px solid ${C.ink}; outline-offset: 2px; }

        .ft-receipt { position: relative; padding: 30px 22px 34px; }
        .ft-receipt::before,
        .ft-receipt::after {
          content: "";
          position: absolute;
          left: 0; right: 0;
          height: 14px;
          background: ${C.paper};
        }
        .ft-receipt::before {
          top: -1px;
          clip-path: polygon(0% 100%,4% 0%,8% 100%,12% 0%,16% 100%,20% 0%,24% 100%,28% 0%,32% 100%,36% 0%,40% 100%,44% 0%,48% 100%,52% 0%,56% 100%,60% 0%,64% 100%,68% 0%,72% 100%,76% 0%,80% 100%,84% 0%,88% 100%,92% 0%,96% 100%,100% 0%);
        }
        .ft-receipt::after {
          bottom: -1px;
          clip-path: polygon(0% 0%,4% 100%,8% 0%,12% 100%,16% 0%,20% 100%,24% 0%,28% 100%,32% 0%,36% 100%,40% 0%,44% 100%,48% 0%,52% 100%,56% 0%,60% 100%,64% 0%,68% 100%,72% 0%,76% 100%,80% 0%,84% 100%,88% 0%,92% 100%,96% 0%,100% 100%);
        }

        .ft-rule { border: none; border-top: 1.5px dashed ${C.paperEdge}; margin: 18px 0; }
        .ft-caption { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: ${C.inkFaint}; margin-bottom: 8px; }
        .ft-nav-btn { background: none; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: ${C.ink}; padding: 2px 10px; }
        .ft-nav-btn:disabled { opacity: 0.25; cursor: default; }

        .ft-item-x { background: none; border: none; color: ${C.inkFaint}; font-size: 16px; line-height: 1; padding: 2px 4px; }
        .ft-item-x:hover { color: ${C.red}; }

        .ft-add-btn {
          width: 100%; padding: 12px; margin-top: 6px;
          background: transparent; border: 1.5px dashed ${C.ink}; border-radius: 3px;
          font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.08em;
          color: ${C.ink};
          transition: background 0.15s ease;
        }
        .ft-add-btn:active { background: ${C.paperEdge}; }

        .ft-stamp {
          display: inline-block;
          border: 2px solid ${C.red};
          color: ${C.red};
          font-family: 'Special Elite', monospace;
          font-size: 13px;
          letter-spacing: 0.06em;
          padding: 4px 10px;
          transform: rotate(-6deg);
          border-radius: 4px;
          animation: ft-stamp-in 0.25s ease-out;
        }
        @keyframes ft-stamp-in {
          from { opacity: 0; transform: rotate(-6deg) scale(1.4); }
          to { opacity: 1; transform: rotate(-6deg) scale(1); }
        }

        .ft-toast {
          position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
          background: ${C.ink}; color: ${C.paper};
          font-family: 'IBM Plex Mono', monospace; font-size: 13px;
          padding: 10px 18px; border-radius: 4px;
          animation: ft-toast-in 0.2s ease-out;
          z-index: 60;
        }
        @keyframes ft-toast-in {
          from { opacity: 0; transform: translate(-50%, 8px); }
          to { opacity: 1; transform: translate(-50%, 0); }
        }

        .ft-overlay {
          position: fixed; inset: 0; background: rgba(43,42,40,0.45);
          display: flex; align-items: flex-end; justify-content: center;
          z-index: 50; animation: ft-fade 0.15s ease-out;
          padding: 0;
        }
        @keyframes ft-fade { from { opacity: 0; } to { opacity: 1; } }

        .ft-modal {
          background: ${C.slip};
          width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto;
          border-radius: 14px 14px 0 0;
          padding: 22px 20px 26px;
          animation: ft-slide-up 0.2s ease-out;
        }
        @media (min-width: 480px) {
          .ft-overlay { align-items: center; }
          .ft-modal { border-radius: 10px; }
        }
        @keyframes ft-slide-up {
          from { transform: translateY(24px); opacity: 0.6; }
          to { transform: translateY(0); opacity: 1; }
        }

        .ft-modal-head {
          display: flex; justify-content: space-between; align-items: center;
          font-family: 'Special Elite', monospace; font-size: 15px; letter-spacing: 0.04em;
          color: ${C.ink}; margin-bottom: 18px;
        }
        .ft-x { background: none; border: none; font-size: 22px; line-height: 1; color: ${C.inkFaint}; padding: 0 4px; }

        .ft-seg {
          border: 1px solid ${C.ink}; border-radius: 20px; padding: 6px 12px;
          font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.03em;
          background: transparent; transition: background 0.15s ease;
        }

        .ft-tab {
          flex: 1; border: 1px solid ${C.ink}; border-radius: 6px; padding: 9px 6px;
          font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; letter-spacing: 0.04em;
          background: transparent; transition: background 0.15s ease;
        }

        .ft-chip { display: inline-flex; align-items: stretch; border: 1px solid ${C.paperEdge}; border-radius: 20px; overflow: hidden; }
        .ft-chip-btn { background: ${C.paper}; border: none; padding: 6px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: ${C.ink}; }
        .ft-chip-x { background: ${C.paper}; border: none; border-left: 1px solid ${C.paperEdge}; padding: 6px 8px; color: ${C.inkFaint}; font-size: 13px; }

        .ft-step {
          width: 30px; height: 30px; border-radius: 50%;
          border: 1px solid ${C.ink}; background: transparent; font-size: 16px; color: ${C.ink};
        }

        .ft-primary {
          width: 100%; padding: 13px; margin-top: 8px;
          background: ${C.ink}; color: ${C.paper}; border: none; border-radius: 4px;
          font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; letter-spacing: 0.08em;
        }
        .ft-primary:active { opacity: 0.85; }

        @media (prefers-reduced-motion: reduce) {
          .ft-page *, .ft-page *::before, .ft-page *::after { animation: none !important; transition: none !important; }
        }
      `}</style>

      <div
        className="ft-page"
        style={{
          minHeight: "100vh",
          background: C.backdrop,
          padding: "32px 14px 60px",
          display: "flex",
          justifyContent: "center",
        }}
      >
        <div style={{ width: "100%", maxWidth: 420 }}>
          <div
            className="ft-receipt"
            style={{
              background: C.paper,
              color: C.ink,
              boxShadow: "0 14px 34px rgba(43,42,40,0.18), 0 3px 8px rgba(43,42,40,0.10)",
            }}
          >
            {/* header */}
            <div style={{ textAlign: "center" }}>
              <div style={{ fontFamily: "'Special Elite', monospace", fontSize: 21, letterSpacing: "0.03em" }}>
                ❖ THE DAILY TAB ❖
              </div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.inkFaint, letterSpacing: "0.12em", marginTop: 4 }}>
                NUTRITION RECEIPT · NO SUBSTITUTIONS
              </div>
            </div>

            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4, marginTop: 16 }}>
              <button className="ft-nav-btn" onClick={() => changeDay(-1)} aria-label="Previous day">
                ‹
              </button>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, letterSpacing: "0.06em", minWidth: 150, textAlign: "center" }}>
                {displayDate(currentDate)}
                {isToday && <span style={{ color: C.inkFaint }}> · TODAY</span>}
              </div>
              <button className="ft-nav-btn" onClick={() => changeDay(1)} aria-label="Next day">
                ›
              </button>
            </div>
            {!isToday && (
              <div style={{ textAlign: "center", marginTop: 4 }}>
                <button
                  onClick={() => setCurrentDate(new Date())}
                  style={{ background: "none", border: "none", color: C.inkFaint, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textDecoration: "underline" }}
                >
                  jump to today
                </button>
              </div>
            )}

            <hr className="ft-rule" />

            {/* remaining budget */}
            <div style={{ textAlign: "center" }}>
              <div className="ft-caption" style={{ textAlign: "center" }}>
                {overBudget ? "OVER BUDGET BY" : "REMAINING"}
              </div>
              <div
                style={{
                  fontFamily: "'Special Elite', monospace",
                  fontSize: 40,
                  color: overBudget ? C.red : C.ink,
                  lineHeight: 1.1,
                }}
              >
                {Math.abs(remaining).toLocaleString()}
              </div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.inkFaint, marginTop: 2 }}>
                kcal · of {goals.calories.toLocaleString()} budgeted
              </div>
              <div style={{ height: 8, background: C.paperEdge, borderRadius: 5, marginTop: 10, overflow: "hidden" }}>
                <div
                  style={{
                    height: "100%",
                    width: `${pctUsed}%`,
                    background: overBudget ? C.red : C.ink,
                    transition: "width 0.3s ease",
                  }}
                />
              </div>
              {overBudget && <div className="ft-stamp" style={{ marginTop: 14 }}>OVER BUDGET</div>}
            </div>

            <hr className="ft-rule" />

            {/* macros */}
            <div>
              {macroRows.map((row) => {
                const pct = row.goal > 0 ? Math.min(100, (row.value / row.goal) * 100) : 0;
                return (
                  <div key={row.label} style={{ marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}>
                      <span style={{ letterSpacing: "0.06em", color: C.inkFaint }}>{row.label}</span>
                      <span>
                        {Math.round(row.value)}g <span style={{ color: C.inkFaint }}>/ {Math.round(row.goal)}g</span>
                      </span>
                    </div>
                    <div style={{ height: 5, background: C.paperEdge, borderRadius: 3, marginTop: 4, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct}%`, background: C.ink, transition: "width 0.3s ease" }} />
                    </div>
                  </div>
                );
              })}
            </div>

            <hr className="ft-rule" />

            {/* meal sections */}
            {entries.length === 0 ? (
              <div style={{ textAlign: "center", color: C.inkFaint, fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, padding: "10px 6px 4px" }}>
                Nothing rung up yet {isToday ? "today" : "this day"}.<br />
                Tap “+ ADD ITEM” to log the first bite.
              </div>
            ) : (
              grouped
                .filter((g) => g.items.length > 0)
                .map((g) => (
                  <div key={g.meal} style={{ marginBottom: 16 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                      <span style={{ fontFamily: "'Special Elite', monospace", fontSize: 13, letterSpacing: "0.05em" }}>{g.meal.toUpperCase()}</span>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.inkFaint }}>{Math.round(g.subtotal)} kcal</span>
                    </div>
                    {g.items.map((item) => (
                      <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 0", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13.5 }}>
                        <span style={{ color: C.inkFaint, minWidth: 28 }}>{item.qty}×</span>
                        <span style={{ flex: 1 }}>{item.name}</span>
                        <span>{Math.round((item.calories || 0) * (item.qty || 1)).toLocaleString()}</span>
                        <button className="ft-item-x" onClick={() => removeEntry(item.id)} aria-label={`Remove ${item.name}`}>
                          ×
                        </button>
                      </div>
                    ))}
                  </div>
                ))
            )}

            <button className="ft-add-btn" onClick={() => setShowAdd(true)}>
              + ADD ITEM
            </button>

            <hr className="ft-rule" />

            {/* total */}
            <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 16 }}>
              <span>TOTAL</span>
              <span>{Math.round(totals.calories).toLocaleString()} kcal</span>
            </div>

            <div style={{ marginTop: 20 }}>
              <Barcode seed={key} />
            </div>
            <div style={{ textAlign: "center", fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: C.inkFaint, letterSpacing: "0.08em", marginTop: 8 }}>
              THANK YOU — COME AGAIN
            </div>
          </div>

          <div style={{ textAlign: "center", marginTop: 18 }}>
            <button
              onClick={() => setShowSettings(true)}
              style={{ background: "none", border: "none", color: C.ink, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.06em" }}
            >
              ⚙ SETTINGS
            </button>
          </div>
        </div>

        {toast && <div className="ft-toast">{toast}</div>}
      </div>

      {showAdd && (
        <AddModal
          favorites={favorites}
          apiKey={apiKey}
          onClose={() => setShowAdd(false)}
          onAdd={addEntry}
          onAddMany={addEntries}
          onSaveFavorite={addFavorite}
          onRemoveFavorite={removeFavorite}
        />
      )}
      {showSettings && (
        <SettingsModal
          goals={goals}
          apiKey={apiKey}
          onClose={() => setShowSettings(false)}
          onSave={persistGoals}
          onSaveApiKey={persistApiKey}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FoodTracker />);
</script>
</body>
</html>
